syntax = "proto3";
package api;

option go_package = "github.com/anon-d/gophKeeper/pkg/proto;pb";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";


// SecretsService provides services for managing secrets.
service SecretsService {
    // ListSecrets returns a list of all secrets meta.
    rpc ListSecrets(google.protobuf.Empty) returns (ListSecretResponse);
    // CreateSecret creates a new secret.
    rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
    // CreateSecretStream creates a new secret using a stream of chunks.
    rpc CreateSecretStream(stream CreateSecretChunkRequest) returns (CreateSecretResponse);
    // GetSecret returns a secret by its ID.
    rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
    // GetSecretStream returns a stream of chunks for a secret by its ID.
    rpc GetSecretStream(GetSecretRequest) returns (stream GetSecretChunkResponse);
    // UpdateSecret updates a secret with optimistic locking.
    rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse);
    // DeleteSecret deletes a secret by its ID.
    rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

// ListSecretResponse is the response for the ListSecrets RPC.
message ListSecretResponse {
    // secrets is a list of secrets meta.
    repeated Secret secrets = 1; // low data, dont send payload, metadata
}

// CreateSecretRequest is the request for the CreateSecret RPC.
message CreateSecretRequest {
    // secret is the secret to create.
    Secret secret = 1;
}

// CreateSecretChunkRequest is used to send chunks of a secret payload.
// 1 chunk: return Secret{payload = nil}, chunk = nil
// next chunks: return Secret = nil, chunk = payload
message CreateSecretChunkRequest {
    // meta is the secret metadata.
    Secret meta = 1;
    // chunk is the chunk of the secret payload.
    bytes chunk = 2;
}

// CreateSecretResponse is the response for the CreateSecret RPC.
message CreateSecretResponse {
    // status is the status of the response.
    string status = 1;
}

// GetSecretRequest is the request for the GetSecret RPC.
message GetSecretRequest {
    // secret_id is the ID of the secret to retrieve.
    string secret_id = 1;
}

// GetSecretResponse is the response for the GetSecret RPC.
message GetSecretResponse {
    // secret is the secret retrieved.
    Secret secret = 1;
}

// GetSecretChunkResponse return data as:
// 1 chunk: return Secret{payload = nil}, chunk = nil
// next chunks: return Secret = nil, chunk = payload
message GetSecretChunkResponse {
    // meta is the secret metadata.
    Secret meta = 1;
    // chunk is the chunk of the secret payload.
    bytes chunk = 2;

}

// UpdateSecretRequest is the request for the UpdateSecret RPC.
message UpdateSecretRequest {
    // secret with updated fields and current version for optimistic locking.
    Secret secret = 1;
}

// UpdateSecretResponse is the response for the UpdateSecret RPC.
message UpdateSecretResponse {
    // new_version is the incremented version after update.
    int64 new_version = 1;
}

// DeleteSecretRequest is the request for the DeleteSecret RPC.
message DeleteSecretRequest {
    // secret_id is the ID of the secret to delete.
    string secret_id = 1;
}

// DeleteSecretResponse is the response for the DeleteSecret RPC.
message DeleteSecretResponse {
    // status is the status of the response.
    string status = 1;
}


// Secret is the secret data.
message Secret {
  // id is the unique identifier of the secret.
  string id = 1;
  // type is the type of the secret.
  SecretType type = 2;     // чтобы десериализовать
  // title is the title of the secret.
  string title = 3;
  // payload is the encrypted payload of the secret.
  bytes payload = 4;       // зашифрованные данные
  // metadata is the metadata of the secret.
  string metadata = 5;     // произвольная мета
  // version is the version of the secret.
  int64 version = 6; // версионирование
  // created_at is the date and time the secret was created.
  google.protobuf.Timestamp created_at = 7; // дата создания
  // updated_at is the date and time the secret was last updated.
  google.protobuf.Timestamp updated_at = 8; // дата обновления
}

// Variants of secret types
enum SecretType {
  // default
  UNKNOWN = 0;
  // username, password, url, meta, etc.
  CREDENTIALS = 1;
  // password
  PASSWORD = 2;
  // number, date, name, csv
  BANKCARD = 3;
  // text (<=16 MB)
  TEXT = 4;
  // binary (+ text > 16 MB)
  BINARY = 5;
}
