syntax = "proto3";
package api;

option go_package = "github.com/anon-d/gophKeeper/pkg/proto;pb";

// AuthService provides authentication services for the gophKeeper API.
service AuthService {
    // Register registers a new user with the given username and password.
    rpc Register(RegisterRequest) returns (RegisterResponse);
    // Login authenticates a user with the given username and password.
    rpc Login(LoginRequest) returns (LoginResponse);
}

// RegisterRequest is the request message for the Register RPC.
message RegisterRequest {
    // username for registration
    string username = 1;
    // password for registration
    string password = 2;
}
// RegisterResponse is the response message for the Register RPC.
message RegisterResponse {
    // status of registration
    string status = 1;
}

// LoginRequest is the request message for the Login RPC.
message LoginRequest {
    // username for login
    string username = 1;
    // password for login
    string password = 2;
}
// LoginResponse is the response message for the Login RPC.
message LoginResponse {
    // token of authentication
    string token = 1;
}
